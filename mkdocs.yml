site_name: "Dependency-Track"
site_url: https://dependencytrack.github.io/docs/
repo_url: https://github.com/DependencyTrack/dependency-track
repo_name: DependencyTrack/dependency-track
docs_dir: docs
copyright: "Copyright &copy; OWASP Foundation. All Rights Reserved."

theme:
  name: material
  custom_dir: overrides
  logo: assets/images/logo.svg
  favicon: assets/images/logo.svg
  palette:
  - scheme: slate
    primary: custom
    accent: custom
    toggle:
      icon: material/brightness-4
      name: Switch to light mode
  - scheme: default
    primary: custom
    accent: custom
    toggle:
      icon: material/brightness-7
      name: Switch to dark mode
  features:
  - content.code.copy
  - content.tabs.link
  - navigation.footer
  - navigation.indexes
  - navigation.path
  - navigation.prune
  - navigation.sections
  - navigation.tabs
  - navigation.tabs.sticky
  - navigation.top
  - navigation.tracking
  - search.highlight
  - toc.follow

extra:
  scarf_pixel: !ENV [SCARF_ENABLED, false]
  version:
    provider: mike
    default: latest
  social:
  - icon: fontawesome/solid/globe
    link: https://dependencytrack.org
    name: Website
  - icon: fontawesome/solid/calendar-days
    link: https://github.com/DependencyTrack/community#community-meetings
    name: Monthly community meeting
  - icon: fontawesome/brands/slack
    link: https://dependencytrack.org/slack
  - icon: fontawesome/brands/github
    link: https://github.com/DependencyTrack
  - icon: fontawesome/brands/docker
    link: https://hub.docker.com/u/dependencytrack
  - icon: fontawesome/brands/linkedin
    link: https://www.linkedin.com/company/owasp-dependency-track
  - icon: fontawesome/brands/mastodon
    link: https://infosec.exchange/@DependencyTrack
  - icon: fontawesome/brands/youtube
    link: https://www.youtube.com/@DependencyTrack

extra_css:
- stylesheets/extra.css

markdown_extensions:
- abbr
- admonition
- attr_list
- footnotes
- md_in_html
- toc:
    permalink: true
- pymdownx.details
- pymdownx.emoji:
    emoji_index: !!python/name:material.extensions.emoji.twemoji
    emoji_generator: !!python/name:material.extensions.emoji.to_svg
- pymdownx.snippets:
    auto_append:
    - docs/includes/abbreviations.md
- pymdownx.superfences:
    custom_fences:
    - name: mermaid
      class: mermaid
      format: !!python/name:pymdownx.superfences.fence_code_format
- pymdownx.tabbed:
    alternate_style: true

hooks:
- scripts/hooks/i18n_awesome_pages.py

plugins:
- search
- social:
    cards_layout_options:
      background_color: "#100a2c"
      color: "#f3f0ff"
      font_family: Plus Jakarta Sans
      # NB: The site's logo renders cut-off in the card.
      # Omitting the logo entirely with a no-op SVG is easier
      # than trying to make it fit right.
      logo: docs/assets/images/social-card-logo.svg
- awesome-pages
- i18n:
    docs_structure: suffix
    fallback_to_default: true
    reconfigure_material: true
    reconfigure_search: true
    languages:
    - locale: en
      default: true
      name: English
      build: true
      # Relative, so that links stay within the mike version directory.
      fixed_link: ./
    - locale: ja
      name: 日本語
      build: true
      fixed_link: ja/
      nav_translations:
